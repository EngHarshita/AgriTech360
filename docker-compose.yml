version: '3.8'

services:
  # 1. Machine Learning Inference Microservice (FastAPI + Scikit-Learn)
  ml-engine:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: agritech360-ml-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - agritech-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. Node.js Express REST API Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agritech360-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      ml-engine:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - API_PREFIX=/api/v1
      - CLIENT_ORIGIN=http://localhost:5173,http://localhost:80,http://localhost
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - BCRYPT_SALT_ROUNDS=10
      - ML_SERVICE_URL=http://ml-engine:8000
      - ML_SERVICE_TIMEOUT_MS=8000
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
    networks:
      - agritech-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/api/v1/health').then(r => { if (![200, 503].includes(r.status)) process.exit(1); }).catch(() => process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 3. React Frontend Client (Vite + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api/v1
        - VITE_USE_MOCK_DATA=false
    container_name: agritech360-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - agritech-net

  # 4. Optional Local MongoDB Database (Can be activated via --profile local-db)
  mongo:
    image: mongo:7-jammy
    container_name: agritech360-local-mongo
    restart: unless-stopped
    profiles:
      - local-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - agritech-net

networks:
  agritech-net:
    driver: bridge

volumes:
  mongo-data:
